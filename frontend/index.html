<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Usage</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <h1>Agent Usage</h1>
          <p class="subtitle">Rate-limit / usage history for local agent CLIs, refreshed every minute.</p>
        </div>
        <label class="range-picker">
          History
          <select id="history-range">
            <option value="15h">Three sessions (15 hours)</option>
            <option value="21d" selected>Three weeks (21 days)</option>
            <option value="90d">Three months (90 days)</option>
          </select>
        </label>
      </header>
      <section id="balances" aria-label="Credit balances and expiry timelines"><div class="card"><h2>Balances &amp; expiry</h2><p class="empty-state">Loading balances…</p></div></section>
      <section id="collectors" class="card" aria-labelledby="collector-title">
        <div class="collector-heading">
          <h2 id="collector-title">Collector status</h2>
          <button id="sampling-toggle" class="settings-button" type="button"
            aria-label="Collection settings" aria-expanded="false" aria-controls="sampling-settings"
            title="Collection settings"><span aria-hidden="true">&#9881;</span></button>
        </div>
        <div id="sampling-settings" hidden>
          <form id="sampling-form">
            <label>Collection interval (minutes)
              <input id="sampling-minutes" type="number" min="1" max="1440" step="any" required value="15" />
            </label>
            <button type="submit">Save interval</button>
            <button id="sampling-refresh" type="button">Collect now</button>
            <label id="sampling-token-field" hidden>Control token
              <input id="sampling-token" type="password" autocomplete="off" />
            </label>
          </form>
          <p id="sampling-status" role="status" aria-live="polite"></p>
        </div>
        <div id="collector-status-table"></div>
      </section>
      <section id="resets" aria-label="Next reset times"></section>
      <section id="charts" aria-label="Usage history charts"></section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
